[package]
name = "sophos-job-containment-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "job-fixture"
path = "fixture.rs"
test = false

[[test]]
name = "windows"
path = "windows.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
