name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    # verify/e2e.mjs runs the real staged daemon + bridge: it uses the bundled
    # Windows Node executable and named-pipe IPC on Windows, or the host Node
    # and Unix-domain sockets on POSIX. The workflow tests the Windows path.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Updater harness (config + keys + signature crypto)
        # BLOCKING — verifies the local updater wiring without any network:
        # tauri.conf.json updater config, capability + plugin registration,
        # signing key pair hygiene, Ed25519 signature crypto (incl. tamper
        # rejection), and the local dummy feed. Pure local Node, so a failure
        # must red the build.
        run: npm run test:updater

      - name: Live update-feed integrity check
        # BLOCKING — verifies the published auto-updater feed exactly as the
        # app consumes it (fetch manifest from the configured endpoint,
        # download the announced installer, verify the Ed25519 signature over
        # the bytes with the configured pubkey, reject tampering). A broken
        # feed means the auto-updater is broken for every user, so a failure
        # must red the build. Network-dependent (hits the live GitLab feed).
        run: node verify/live-feed.mjs

      - name: Runtime helper and fail-closed gate regression tests
        run: node --test scripts/daemon-runtime-package.test.mjs scripts/node-runtime.test.mjs scripts/prime-agent-ref.test.mjs scripts/apply-prime-agent-overlay.test.mjs verify/e2e-result.test.mjs verify/runtime-executable.test.mjs verify/e2e-failure-exit.test.mjs verify/e2e-home-cleanup.test.mjs scripts/bundle.test.mjs bridge/verify.test.mjs

      - name: Platform provenance and Tauri resource tests
        run: node --test scripts/native-runtime-platform.test.mjs scripts/bundle-platform.test.mjs scripts/tauri-license-resource.test.mjs scripts/tauri-package-license.test.mjs

      # Build all ignored runtime inputs from a fresh checkout. The bundler
      # verifies the exact public Prime Agent tag/commit/license, performs
      # normal npm lifecycle installation, builds daemon + bridge, and fetches
      # the hash-pinned official Windows Node executable before staging.
      - name: Build complete runtime bundle
        run: node scripts/bundle.mjs

      - name: Load production Windows native modules
        run: node scripts/verify-native-runtime.mjs

      - name: Focused JSON-RPC wire regression
        run: node bridge/verify-rpc-errors.test.mjs

      - name: Build guarded Tauri MSI
        run: node scripts/build-windows-installer.mjs

      - name: Verify MIT notice is inside the built MSI
        run: node scripts/verify-tauri-package.mjs

      - name: Verify bridge compatibility with the pinned daemon
        run: npm --prefix bridge run test:kernel-compat

      # Exercise the real staged daemon + bridge together over the platform's
      # supported local-socket transport; the harness also validates the pinned
      # upstream commit, packaged Node checksum, runtime dependencies, and daemon
      # reconnect behavior. TCP fallback is explicitly not assumed.
      - name: End-to-end verification
        run: node verify/e2e.mjs

  # cua-e2e — drives the REAL Sophos desktop app (Tauri v2 release build) via
  # cua-driver and Windows UI Automation. The build stages real pinned runtime
  # resources and the upstream license; UI suites use the app's disclosed demo
  # IPC path to verify native startup/render and simulated interactions only.
  # This does not claim provider/model generation.
  #
  # cua-driver requires a logged-on Windows user session for UIA. The prior
  # readiness error did not record the runner session and is not enough to
  # attribute the failure to a desktop limitation. The CUA suite is a hard
  # acceptance gate; host diagnostics are recorded after the attempt.
  cua-e2e:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        # tsc && vite build — emits dist/ that the Tauri shell embeds.
        run: npm run build

      - name: Build actual pinned runtime resources
        # Even the simulated UI build uses real pinned resources and the upstream
        # MIT notice. No placeholder runtime is counted as packaging evidence.
        run: node scripts/bundle.mjs

      - name: Build Tauri release exe
        # cargo build --release compiles the Rust shell and embeds the
        # frontend from ../dist, producing
        # src-tauri/target/release/prime-agent-windows.exe. We deliberately do
        # NOT run `npx tauri build`, which would try to bundle installers and
        # needs the gitignored resources/ directory. The raw exe is all the
        # cua-driver e2e tests need.
        working-directory: src-tauri
        run: cargo build --release

      - name: Install cua-driver
        # Resolve the per-user install from this runner, not an agent-specific
        # profile path. The path is exported for verify/cua/driver.mjs.
        shell: pwsh
        run: |
          irm https://cua.ai/driver/install.ps1 | iex
          $cua = Join-Path $env:LOCALAPPDATA 'Programs'
          $cua = Join-Path $cua 'Cua'
          $cua = Join-Path $cua 'cua-driver'
          $cua = Join-Path $cua 'bin'
          $cua = Join-Path $cua 'cua-driver.exe'
          if (-not (Test-Path -LiteralPath $cua)) { throw "cua-driver was not installed at $cua" }
          "CUA_DRIVER_BIN=$cua" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Write-Host "CUA_DRIVER_BIN=$cua"
          & $cua --version
          if ($LASTEXITCODE -ne 0) { throw "cua-driver --version exited $LASTEXITCODE" }

      - name: Test CUA driver and checkout path prerequisites
        run: >-
          node --test
          verify/cua/driver-path.test.mjs
          verify/cua/driver-screenshot-context.test.mjs
          verify/cua/chat-app-path.test.mjs
          verify/cua/driver-session.test.mjs

      - name: Run cua-driver native UI acceptance
        # This is a required check. It drives the real Tauri release executable
        # built above and retains the demo IPC boundary; failures fail the job.
        run: node verify/cua/run-all.mjs

      - name: Record cua-driver Windows session diagnostics
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          Write-Host "RUNNER_USER=$env:USERNAME"
          $jobSessionId = (Get-Process -Id $PID).SessionId
          Write-Host "JOB_SESSION_ID=$jobSessionId"
          Write-Host 'CUA_DRIVER_PROCESSES:'
          Get-Process -Name cua-driver -ErrorAction SilentlyContinue | Select-Object Id, SessionId, StartTime
          if (-not (Test-Path -LiteralPath $env:CUA_DRIVER_BIN)) {
            Write-Host "CUA_DRIVER_MISSING=$env:CUA_DRIVER_BIN"
          } else {
            Write-Host 'CUA_DRIVER_DOCTOR:'
            & $env:CUA_DRIVER_BIN doctor
            Write-Host "CUA_DOCTOR_EXIT_CODE=$LASTEXITCODE"
            Write-Host 'CUA_DRIVER_STATUS:'
            & $env:CUA_DRIVER_BIN status
            Write-Host "CUA_STATUS_EXIT_CODE=$LASTEXITCODE"
          }
