name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    # verify/e2e.mjs is Windows-specific: it drives named-pipe transports
    # (`\\.\pipe\...`), uses `taskkill /T` for process-tree teardown, and boots
    # a bundled `node-v24.18.0-win-x64` runtime. Run the whole job on Windows.
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npx vitest run

      - name: Updater harness (config + keys + signature crypto)
        # BLOCKING — verifies the local updater wiring without any network:
        # tauri.conf.json updater config, capability + plugin registration,
        # signing key pair hygiene, Ed25519 signature crypto (incl. tamper
        # rejection), and the local dummy feed. Pure local Node, so a failure
        # must red the build.
        run: npm run test:updater

      - name: Live update-feed integrity check
        # BLOCKING — verifies the published auto-updater feed exactly as the
        # app consumes it (fetch manifest from the configured endpoint,
        # download the announced installer, verify the Ed25519 signature over
        # the bytes with the configured pubkey, reject tampering). A broken
        # feed means the auto-updater is broken for every user, so a failure
        # must red the build. Network-dependent (hits the live GitLab feed).
        run: node verify/live-feed.mjs

      # e2e.mjs boots the BUNDLED runtime (resources/node/<version>/node.exe +
      # resources/daemon/dist + resources/bridge/dist + shared node_modules),
      # which is gitignored and assembled only on the developer machine by
      # `node scripts/bundle.mjs` (it needs a local prime-agent-ref checkout and
      # the AppData node_modules ship — neither exists in a fresh CI checkout).
      # So this step is best-effort here: it still runs, but a failure does not
      # red the build. Run `node scripts/bundle.mjs && node verify/e2e.mjs`
      # locally before merge; see CONTRIBUTING.md.
      - name: End-to-end verification (best-effort)
        run: node verify/e2e.mjs
        continue-on-error: true

  # cua-e2e — drives the REAL Sophos desktop app (Tauri v2 release build) via
  # the cua-driver CLI and UIA accessibility automation (verify/cua/*). These
  # tests run in DEMO MODE (the `--demo` flag skips the daemon + sidecar and
  # injects window.__SOPHOS_DEMO__ = true, so the frontend uses the
  # MockIpcClient with simulated Sessions/Agents data). Unlike the bundled
  # verify/e2e.mjs step above (which needs a gitignored bundled runtime that
  # doesn't exist in a fresh CI checkout), the cua-driver suite only needs the
  # compiled exe + the cua-driver binary — both produced entirely here from
  # source. So this job is BLOCKING: a failure must red the build and stop the
  # merge, because it exercises real UI behavior that unit tests cannot.
  #
  # Requires a desktop session (UIA/window automation) and WebView2, both
  # available on windows-latest runners, so we build and run on Windows.
  cua-e2e:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend
        # tsc && vite build — emits dist/ that the Tauri shell embeds.
        run: npm run build

      - name: Build Tauri release exe
        # cargo build --release compiles the Rust shell and embeds the
        # frontend from ../dist, producing
        # src-tauri/target/release/prime-agent-windows.exe. We deliberately do
        # NOT run `npx tauri build`, which would try to bundle installers and
        # needs the gitignored resources/ directory. The raw exe is all the
        # cua-driver e2e tests need.
        working-directory: src-tauri
        run: cargo build --release

      - name: Install cua-driver
        # The cua-driver binary is installed to
        # %LOCALAPPDATA%\Programs\Cua\cua-driver\bin\cua-driver.exe and found
        # by verify/cua/driver.mjs (overridable via CUA_DRIVER_BIN).
        shell: pwsh
        run: irm https://cua.ai/driver/install.ps1 | iex

      - name: Run cua-driver e2e suite
        # BLOCKING — deliberately no continue-on-error. Run-all drives the real
        # app in demo mode through every cua-driver e2e suite; it exits 0 on
        # all-pass and 1 on any failure.
        run: node verify/cua/run-all.mjs

  # release — runs ONLY on tag pushes (v*). Gated on test + cua-e2e, which
  # already build the exe and run the full e2e suite on the tag; this job adds
  # the two release-specific checks: the live update-feed integrity check and
  # (when the gitignored runtime bundle is present) the NSIS installer build.
  #
  # The NSIS installer needs resources/daemon/dist, resources/bridge/dist,
  # resources/node_modules and resources/node/…/node.exe — all gitignored and
  # assembled locally by `node scripts/bundle.mjs` from the (locally-modified)
  # prime-agent-ref checkout + AppData node_modules. That bundle is not
  # reproducible on a fresh hosted runner, so the installer step builds only
  # when the bundle is present (e.g. a self-hosted runner with the full local
  # checkout) and otherwise skips with a warning — the live-feed check always
  # runs, so a tag is still verified. See docs/installer-reproducibility-0.8.0.md
  # for the exact blocker and the operator steps to make this reproducible.
  release:
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, cua-e2e]
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      # Optional — configure these two secrets to produce a SIGNED installer in
      # CI. Without them the installer still builds, but no .sig is generated
      # (sign with `npx tauri signer sign` at release time).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Live update-feed integrity check
        # BLOCKING — verifies the published feed (manifest + installer download
        # + Ed25519 signature) exactly as the app consumes it.
        run: node verify/live-feed.mjs

      - name: Build NSIS installer (when the runtime bundle is present)
        id: installer
        shell: pwsh
        run: |
          $need = @(
            "resources/node/node-v24.18.0-win-x64/node.exe",
            "resources/daemon/dist/cli.js",
            "resources/bridge/dist/bridge/src/index.js",
            "resources/node_modules"
          )
          $missing = @($need | Where-Object { -not (Test-Path $_) })
          if ($missing.Count -gt 0) {
            Write-Host "::warning::Installer build skipped: gitignored runtime bundle not assembled in CI (missing $($missing -join ', ')). Run 'node scripts/bundle.mjs' then 'npm run tauri build' locally."
            "INSTALLER_BUILT=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          npm run tauri build
          "INSTALLER_BUILT=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload NSIS installer artifact
        if: steps.installer.outputs.INSTALLER_BUILT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Sophos-${{ github.ref_name }}-x64-setup
          path: |
            src-tauri/target/release/bundle/nsis/Sophos_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/Sophos_*_x64-setup.exe.sig
          if-no-files-found: error
